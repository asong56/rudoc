[package]
name        = "rudoc"
version     = "0.1.0"
edition     = "2021"
description = "A fast, minimal document converter"
license     = "MIT"

[[bin]]
name = "rudoc"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[features]
default = []
pdf     = []

[dependencies]
clap       = { version = "=4.4.18", features = ["derive", "wrap_help"] }
anyhow     = "=1.0.86"
thiserror  = "=1.0.63"

pulldown-cmark          = "=0.9.6"
pulldown-cmark-to-cmark = "=10.0.4"

html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"

docx-rs = "=0.4.17"

calamine        = "=0.22.1"
rust_xlsxwriter = "=0.44.0"

csv = "=1.3.0"

quick-xml = "=0.31.0"

serde      = { version = "=1.0.196", features = ["derive"] }
serde_json = "=1.0.113"
indexmap   = "=2.2.6"

zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
base64 = "=0.21.7"

# Pin transitive deps to pre-edition2024 versions
hashbrown = "=0.14.5"

