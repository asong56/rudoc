[package]
name        = "rudoc"
version     = "0.1.0"
edition     = "2021"
description = "Fast, dependency-free document converter: md/html/docx/pdf/pptx/csv/xlsx/xml/json"
license     = "MIT"
authors     = ["Rudoc Contributors"]
repository  = "https://github.com/asong56/rudoc"
homepage    = "https://github.com/asong56/rudoc"
keywords    = ["pandoc", "markdown", "docx", "converter", "document"]
categories  = ["command-line-utilities", "text-processing"]
readme      = "README.md"
exclude     = [".github/", "dist/", "*.snap"]

[[bin]]
name = "rudoc"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[features]
default = []
pdf     = ["dep:printpdf"]

[dependencies]
clap       = { version = "=4.4.18", features = ["derive", "wrap_help"] }
anyhow     = "=1.0.86"
thiserror  = "=1.0.63"

pulldown-cmark          = "=0.9.6"
pulldown-cmark-to-cmark = "=10.0.4"

html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"

docx-rs = "=0.4.17"

calamine        = "=0.22.1"
rust_xlsxwriter = "=0.44.0"

csv = "=1.3.0"

# Pinned to 0.30.0 (not the newer 0.31.0) to match calamine's own
# requirement (`^0.30`) so Cargo compiles ONE quick-xml instead of two —
# verified 0.30→0.31 has no API differences affecting our usage.
quick-xml = "=0.30.0"

serde      = { version = "=1.0.196", features = ["derive"] }
serde_json = "=1.0.113"
indexmap   = "=2.2.6"

zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
# gif/bmp cost nothing extra here: docx-rs already requires them transitively,
# so the shared `image` build includes them regardless of this list. webp is
# NOT required by any other dependency, so omitting it is a real size saving.
image      = { version = "=0.24.9", default-features = false, features = ["png","jpeg","gif","bmp"] }
printpdf   = { version = "=0.5.0", optional = true }

# Pin transitive deps to pre-edition2024 versions
hashbrown = "=0.14.5"

